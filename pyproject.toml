[project]
name = "costing-agent"
version = "0.1.0"
description = "Learn costing structure from past sheets; generate new costing sheets and offers"
requires-python = ">=3.10"
dependencies = ["openpyxl", "python-docx", "pdfplumber"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
[project.scripts]
costing-agent = "costing_agent.cli:main"
